name: OrangeHRM CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Compile project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile project
        run: mvn -B -ntp clean test-compile -DskipTests

  deploy-verify:
    name: Deploy and verify CD
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64, orangehrm-local]
    timeout-minutes: 30
    concurrency:
      group: orangehrm-local-tests
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    env:
      HEADLESS: 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Record DEV state
        id: dev_before
        run: |
          $dev = @('orangehrmtesting-orangehrm-1', 'orangehrmtesting-db-1', 'orangehrmtesting-allure-1')
          $state = & docker inspect $dev --format '{{.Id}} {{.State.Running}} {{json .Mounts}}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect DEV containers' }
          $state | Set-Content "$env:RUNNER_TEMP/dev-before-$env:GITHUB_RUN_ID.log"

      - name: Create CD config
        env:
          CD_CONFIG: ${{ secrets.ORANGEHRM_CD_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CD_CONFIG)) {
            throw 'Missing ORANGEHRM_CD_CONFIG. See docs/docker-cd.md.'
          }
          $configPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/config.cd.properties'
          [System.IO.File]::WriteAllText($configPath, $env:CD_CONFIG)

      - name: Deploy OrangeHRM CD
        env:
          CD_DB_PASSWORD: ${{ secrets.ORANGEHRM_CD_DB_PASSWORD }}
        run: |
          & .\deploy\deploy.ps1 *> ci-deploy.log

      - name: Wait for OrangeHRM
        run: .\deploy\wait-ready.ps1

      - name: Seed CD test data
        run: .\deploy\seed.ps1

      - name: Run login smoke
        run: |
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-smoke "-Dconfig.file=deploy/config.cd.properties" *> ci-smoke.log
          if ($null -eq $LASTEXITCODE) { exit 1 }
          exit $LASTEXITCODE

      - name: Check smoke result and prepare evidence
        if: always()
        run: .\deploy\smoke-report.ps1

      - name: Run PIM baseline tests
        id: pim
        run: |
          $report = 'target/cd-pim/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-pim "-Dconfig.file=deploy/config.cd.properties" *> ci-pim.log
          if ($null -eq $LASTEXITCODE) { exit 1 }
          exit $LASTEXITCODE

      - name: Check PIM result and prepare evidence
        if: always() && (steps.pim.outcome == 'success' || steps.pim.outcome == 'failure')
        run: .\deploy\pim-report.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-smoke-${{ github.run_number }}
          path: |
            target/cd-evidence/smoke-summary.json
            target/cd-evidence/pim-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Check DEV is unchanged
        if: always() && steps.dev_before.outcome == 'success'
        run: |
          $dev = @('orangehrmtesting-orangehrm-1', 'orangehrmtesting-db-1', 'orangehrmtesting-allure-1')
          $after = & docker inspect $dev --format '{{.Id}} {{.State.Running}} {{json .Mounts}}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect DEV after CD' }
          $before = Get-Content "$env:RUNNER_TEMP/dev-before-$env:GITHUB_RUN_ID.log"
          if (Compare-Object $before $after) { throw 'DEV container state or mounts changed; inspect locally' }
          Write-Host 'DEV container IDs, running state and volumes are unchanged.'

      - name: Show local report locations
        if: always()
        run: |
          Write-Host "$env:GITHUB_WORKSPACE/ci-deploy.log"
          Write-Host "$env:GITHUB_WORKSPACE/ci-smoke.log"
          Write-Host "$env:GITHUB_WORKSPACE/ci-pim.log"
          Write-Host "$env:GITHUB_WORKSPACE/target/cd-pim"
          Write-Host "$env:GITHUB_WORKSPACE/target/surefire-reports"
          Write-Host "$env:GITHUB_WORKSPACE/target/allure-results"

      - name: Remove generated config
        if: always()
        run: |
          $configPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/config.cd.properties'
          if (Test-Path -LiteralPath $configPath) {
            Remove-Item -LiteralPath $configPath -Force
          }
