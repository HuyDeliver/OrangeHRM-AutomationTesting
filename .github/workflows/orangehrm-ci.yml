name: OrangeHRM CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Compile project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile project
        run: mvn -B -ntp clean test-compile -DskipTests

  deploy-verify:
    name: Deploy and verify CD
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64, orangehrm-local]
    timeout-minutes: 30
    concurrency:
      group: orangehrm-local-tests
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    env:
      HEADLESS: 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Record DEV state
        id: dev_before
        run: |
          $dev = @('orangehrmtesting-orangehrm-1', 'orangehrmtesting-db-1', 'orangehrmtesting-allure-1')
          $state = & docker inspect $dev --format '{{.Id}} {{.State.Running}} {{json .Mounts}}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect DEV containers' }
          $state | Set-Content "$env:RUNNER_TEMP/dev-before-$env:GITHUB_RUN_ID.log"

      - name: Create CD config
        env:
          CD_CONFIG: ${{ secrets.ORANGEHRM_CD_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CD_CONFIG)) {
            throw 'Missing ORANGEHRM_CD_CONFIG. See docs/docker-cd.md.'
          }
          $configPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/config.cd.properties'
          [System.IO.File]::WriteAllText($configPath, $env:CD_CONFIG)
          # Cùng nguồn dữ liệu với seed; không yêu cầu sửa Secret khi đổi tên fixture.
          $fixture = Get-Content 'deploy/seed.properties' -Raw | ConvertFrom-StringData
          $employee = $fixture['employee.firstName'] + ' ' + $fixture['employee.lastName']
          [System.IO.File]::AppendAllText($configPath, "`nadmin.employee.name=$employee`n")
          $pimDataPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/pim.properties'
          [System.IO.File]::AppendAllText($configPath, "`n" + [System.IO.File]::ReadAllText($pimDataPath) + "`n")

          $recruitmentDataPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/recruitment.properties'
          [System.IO.File]::AppendAllText($configPath, "`n" + [System.IO.File]::ReadAllText($recruitmentDataPath) + "`n")

          $myInfoDataPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/myinfo.properties'
          [System.IO.File]::AppendAllText($configPath, "`n" + [System.IO.File]::ReadAllText($myInfoDataPath) + "`n")

          $performanceDataPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/performance.properties'
          [System.IO.File]::AppendAllText($configPath, "`n" + [System.IO.File]::ReadAllText($performanceDataPath) + "`n")

          $apiDataPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/api.properties'
          [System.IO.File]::AppendAllText($configPath, "`n" + [System.IO.File]::ReadAllText($apiDataPath) + "`n")

      - name: Deploy OrangeHRM CD
        env:
          CD_DB_PASSWORD: ${{ secrets.ORANGEHRM_CD_DB_PASSWORD }}
        run: |
          & .\deploy\deploy.ps1 *> ci-deploy.log

      - name: Wait for OrangeHRM
        id: readiness
        run: .\deploy\wait-ready.ps1

      - name: Seed CD test data
        id: seed
        run: .\deploy\seed.ps1 -IncludeApi

      - name: Upload seed log on failure
        if: ${{ !cancelled() && steps.seed.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: cd-seed-log-${{ github.run_number }}
          path: |
            target/cd-seed/*/seed.log
            target/cd-seed/*/*.properties
          retention-days: 7

      - name: Run login smoke
        id: smoke
        if: ${{ !cancelled() && steps.readiness.outcome == 'success' }}
        run: |
          if (Test-Path -LiteralPath 'target/cd-allure-results') {
            Remove-Item -Path 'target/cd-allure-results/*' -Recurse -Force -ErrorAction SilentlyContinue
          }
          $report = 'target/surefire-reports/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report -Force }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-smoke "-Dconfig.file=deploy/config.cd.properties" *> ci-smoke.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check smoke result and prepare evidence
        id: smoke_check
        if: ${{ !cancelled() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure') }}
        run: .\deploy\smoke-report.ps1

      - name: Run PIM baseline tests
        id: pim
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-pim/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-pim "-Dconfig.file=deploy/config.cd.properties" *> ci-pim.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check PIM result and prepare evidence
        if: always() && (steps.pim.outcome == 'success' || steps.pim.outcome == 'failure')
        run: .\deploy\pim-report.ps1

      - name: Run full PIM regression
        id: pim_regression
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-pim-regression/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-pim-regression "-Dconfig.file=deploy/config.cd.properties" *> ci-pim-regression.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check PIM regression result and cleanup
        if: always() && (steps.pim_regression.outcome == 'success' || steps.pim_regression.outcome == 'failure')
        run: .\deploy\pim-regression-report.ps1

      - name: Run full Admin regression
        id: admin
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-admin/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-admin "-Dconfig.file=deploy/config.cd.properties" *> ci-admin.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check Admin result and cleanup
        if: always() && (steps.admin.outcome == 'success' || steps.admin.outcome == 'failure')
        run: .\deploy\admin-report.ps1

      - name: Run full Recruitment regression
        id: recruitment
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-recruitment/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-recruitment "-Dconfig.file=deploy/config.cd.properties" *> ci-recruitment.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check Recruitment result and cleanup
        if: always() && (steps.recruitment.outcome == 'success' || steps.recruitment.outcome == 'failure')
        run: .\deploy\recruitment-report.ps1

      - name: Run My Info regression
        id: myinfo
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-myinfo/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-myinfo "-Dconfig.file=deploy/config.cd.properties" *> ci-myinfo.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check My Info result
        if: always() && (steps.myinfo.outcome == 'success' || steps.myinfo.outcome == 'failure')
        run: .\deploy\myinfo-report.ps1

      - name: Run Performance regression
        id: performance
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-performance/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-performance "-Dconfig.file=deploy/config.cd.properties" *> ci-performance.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check Performance result
        if: always() && (steps.performance.outcome == 'success' || steps.performance.outcome == 'failure')
        run: .\deploy\performance-report.ps1

      - name: Run Profile regression
        id: profile
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-profile/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-profile "-Dconfig.file=deploy/config.cd.properties" *> ci-profile.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check Profile result
        if: always() && (steps.profile.outcome == 'success' || steps.profile.outcome == 'failure')
        run: .\deploy\profile-report.ps1

      - name: Run Time regression
        id: time
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-time/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-time "-Dconfig.file=deploy/config.cd.properties" *> ci-time.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check Time result
        if: always() && (steps.time.outcome == 'success' || steps.time.outcome == 'failure')
        run: .\deploy\time-report.ps1

      - name: Run Claim regression
        id: claim
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-claim/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-claim "-Dconfig.file=deploy/config.cd.properties" *> ci-claim.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check Claim result
        if: always() && (steps.claim.outcome == 'success' || steps.claim.outcome == 'failure')
        run: .\deploy\claim-report.ps1

      - name: Run API tests
        id: api
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-api/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-api "-Dconfig.file=deploy/config.cd.properties" *> ci-api.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check API result
        if: always() && (steps.api.outcome == 'success' || steps.api.outcome == 'failure')
        run: .\deploy\api-report.ps1 -Name api -Expected 53

      - name: Run Security tests
        id: security
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.smoke_check.outcome == 'success' }}
        run: |
          $report = 'target/cd-security/surefire/testng-results.xml'
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          $ErrorActionPreference = 'Continue'
          & mvn -B -ntp test -Pcd-security "-Dconfig.file=deploy/config.cd.properties" *> ci-security.log
          if (-not (Test-Path -LiteralPath $report)) { exit 1 }
          exit 0

      - name: Check Security result
        if: always() && (steps.security.outcome == 'success' || steps.security.outcome == 'failure')
        run: .\deploy\api-report.ps1 -Name security -Expected 9

      - name: Publish CD Allure results to local dashboard
        if: always()
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'target/cd-allure-results'
          $resultCount = @(Get-ChildItem -LiteralPath $source -Filter '*-result.json' -File -ErrorAction SilentlyContinue).Count
          if ($resultCount -eq 0) {
            Write-Warning 'No CD Allure results were generated; nothing to publish.'
            exit 0
          }

          $container = & docker ps --filter 'label=com.docker.compose.service=allure-cd' --format '{{.Names}}' | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($container)) {
            Write-Warning 'Allure CD container is not running. Start it with: docker compose up -d allure-cd'
            exit 0
          }

          $inspectJson = & docker inspect $container | ConvertFrom-Json
          $destination = $inspectJson.Mounts | Where-Object { $_.Destination -eq '/app/allure-results' } | Select-Object -ExpandProperty Source -First 1
          if ([string]::IsNullOrWhiteSpace($destination)) {
            Write-Warning 'Could not find the Allure CD results mount; results were not copied.'
            exit 0
          }

          if ([System.IO.Path]::GetFullPath($source).TrimEnd('\') -ieq [System.IO.Path]::GetFullPath($destination).TrimEnd('\')) {
            Write-Host 'CD Allure results already use the dashboard results folder.'
          } else {
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Remove-Item -Path (Join-Path $destination '*-result.json'), (Join-Path $destination '*-container.json'), (Join-Path $destination '*-attachment*') -Force -ErrorAction SilentlyContinue
            Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force
            Write-Host "Published $resultCount CD Allure test results to the local dashboard ($destination)."
          }

          try {
            Invoke-RestMethod -Uri "http://localhost:5051/allure-docker-service/generate-report" -Method Get -TimeoutSec 10 | Out-Null
            Write-Host "Triggered Allure report generation on http://localhost:5051"
          } catch {
            Write-Warning "Could not trigger immediate Allure report generation: $_"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-smoke-${{ github.run_number }}
          path: |
            target/cd-evidence/smoke-summary.json
            target/cd-evidence/pim-summary.json
            target/cd-evidence/pim-regression-summary.json
            target/cd-evidence/admin-summary.json
            target/cd-evidence/myinfo-summary.json
            target/cd-evidence/performance-summary.json
            target/cd-evidence/profile-summary.json
            target/cd-evidence/time-summary.json
            target/cd-evidence/claim-summary.json
            target/cd-evidence/recruitment-summary.json
            target/cd-evidence/api-summary.json
            target/cd-evidence/security-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Check DEV is unchanged
        if: always() && steps.dev_before.outcome == 'success'
        run: |
          $dev = @('orangehrmtesting-orangehrm-1', 'orangehrmtesting-db-1', 'orangehrmtesting-allure-1')
          $after = & docker inspect $dev --format '{{.Id}} {{.State.Running}} {{json .Mounts}}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect DEV after CD' }
          $before = Get-Content "$env:RUNNER_TEMP/dev-before-$env:GITHUB_RUN_ID.log"
          if (Compare-Object $before $after) { throw 'DEV container state or mounts changed; inspect locally' }
          Write-Host 'DEV container IDs, running state and volumes are unchanged.'

      - name: Show local report locations
        if: always()
        run: |
          Write-Host "$env:GITHUB_WORKSPACE/ci-deploy.log"
          Write-Host "$env:GITHUB_WORKSPACE/ci-smoke.log"
          Write-Host "$env:GITHUB_WORKSPACE/ci-pim.log"
          Write-Host "$env:GITHUB_WORKSPACE/ci-pim-regression.log"
          Write-Host "$env:GITHUB_WORKSPACE/target/cd-pim-regression"
          Write-Host "$env:GITHUB_WORKSPACE/ci-myinfo.log"
          Write-Host "$env:GITHUB_WORKSPACE/target/cd-myinfo"
          Write-Host "$env:GITHUB_WORKSPACE/ci-performance.log"
          Write-Host "$env:GITHUB_WORKSPACE/target/cd-performance"
          Write-Host "$env:GITHUB_WORKSPACE/ci-profile.log"
          Write-Host "$env:GITHUB_WORKSPACE/target/cd-profile"
          Write-Host "$env:GITHUB_WORKSPACE/ci-recruitment.log"
          Write-Host "$env:GITHUB_WORKSPACE/target/cd-recruitment"
          Write-Host "$env:GITHUB_WORKSPACE/target/cd-allure-results"
          Write-Host "$env:GITHUB_WORKSPACE/ci-admin.log"
          Write-Host "$env:GITHUB_WORKSPACE/target/cd-admin"
          Write-Host "$env:GITHUB_WORKSPACE/target/cd-pim"
          Write-Host "$env:GITHUB_WORKSPACE/target/surefire-reports"
          Write-Host "$env:GITHUB_WORKSPACE/target/allure-results"

      - name: Remove generated config
        if: always()
        run: |
          $configPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/config.cd.properties'
          if (Test-Path -LiteralPath $configPath) {
            Remove-Item -LiteralPath $configPath -Force
          }
